<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: #222;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #settings p,
      #btn-render {
        margin-inline: 20px;
      }

      p {
        color: white;
      }

      #btn-render {
        height: 30px;
      }

      #board {
        display: grid;
        border: 5px dashed lightblue;
      }

      .box {
        display: grid;

        width: 20px;
        aspect-ratio: 1;
        border: 1px dotted lightblue;
      }

      .snake-body {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        grid-area: 1 / 1;
        z-index: 10;

        background: orange;
      }

      .snake-food {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        grid-area: 1 / 1;
        z-index: 1;

        background: yellowgreen;
        border-radius: 100%;
      }

      .row {
        display: flex;
        align-items: center;
      }

      .flex {
        display: flex;
      }

      #end {
        position: absolute;
        top: 100px;
        display: flex;
        align-items: center;
        flex-direction: column;

        display: none;
      }
      #end p {
        margin: 5px;
      }
    </style>
  </head>
  <body onkeydown="keyDown(event)">
    <section id="settings">
      <div class="row">
        <p>Rozmiar planszy:</p>
        <input
          type="range"
          id="size-input"
          oninput="sizeChange()"
          min="10"
          max="100"
          value="20"
        />
        <p id="size-label"></p>
        <button onclick="render()" id="btn-render">Generuj</button>
      </div>
    </section>
    <div class="flex">
      <div id="board"></div>
    </div>
    <div id="end">
      <p><b>Koniec gry!</b></p>
      <p id="end-score"></p>
      <button onclick="reset()">Reset</button>
    </div>

    <script>
      const SNAKE_FOOD_INTERVAL = 2000;
      const SNAKE_MOVE_INTERVAL = 200;
      const board = document.getElementById("board");

      let boxesMetadata = [];
      let snakeBody = [];
      let boardSize;
      let direction;
      let gameStarted;
      let snakeMoving;
      let foodSpawning;

      sizeChange();

      function sizeChange() {
        const range = document.getElementById("size-input");
        const size = range.value;

        document.getElementById("size-label").textContent = size;

        boardSize = size;
      }

      render();

      function render() {
        boxesMetadata = [];
        snakeBody = [];
        gameStarted = false;

        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        const gridTemplate = `repeat(${boardSize}, 1fr)`;
        board.style.gridTemplateRows = gridTemplate;
        board.style.gridTemplateColumns = gridTemplate;
        board.replaceChildren();

        for (let y = 0; y < boardSize; y++) {
          const boxesMetadataRow = [];

          for (let x = 0; x < boardSize; x++) {
            const box = document.createElement("div");
            box.className = "box";
            box.setAttribute("id", "pos-" + x + "-" + y);
            board.appendChild(box);
            boxesMetadataRow.push({ food: false });
          }

          boxesMetadata.push(boxesMetadataRow);
        }

        snakeBody.push({
          x: boardSize / 2,
          y: boardSize / 2,
        });
      }

      function keyDown(event) {
        if (!gameStarted) {
          gameStarted = true;
          snakeMoving = setInterval(moveSnake, SNAKE_MOVE_INTERVAL);
          //foodSpawning = setInterval(newSnakeFood, SNAKE_FOOD_INTERVAL);

          newSnakeFood();
        }

        const newDirection = event.keyCode - 37;
        if (newDirection > 3 || newDirection < 0) return;

        if ((direction - newDirection) % 2 == 0) return;
        direction = newDirection;
        console.log("newDirection", direction);
      }

      function moveSnake() {
        const snakeHead = snakeBody[snakeBody.length - 1];

        const newHead = {
          x: direction % 2 == 0 ? snakeHead.x + (direction - 1) : snakeHead.x,
          y: direction % 2 == 1 ? snakeHead.y + (direction - 2) : snakeHead.y,
        };
        console.log(newHead);

        let boxMetadata;
        try {
          boxMetadata = boxesMetadata[newHead.y][newHead.x];
        } catch (err) {
          endGame("1");
          return;
        }

        const tdHead = document.getElementById(
          "pos-" + newHead.x + "-" + newHead.y
        );

        if (boxMetadata?.food) {
          tdHead.replaceChildren();
          newSnakeFood();
        } else {
          const snakeButt = snakeBody[0];

          const tdButt = document.getElementById(
            "pos-" + snakeButt.x + "-" + snakeButt.y
          );
          tdButt.replaceChildren();

          boxesMetadata[snakeButt.y][snakeButt.x].snake = false;

          snakeBody.shift();
        }

        if (boxMetadata === undefined || boxMetadata.snake == true) {
          endGame("2");
          return;
        }

        boxesMetadata[newHead.y][newHead.x].snake = true;

        snakeBody.push(newHead);

        const img = document.createElement("div");
        img.className = "snake-body";
        tdHead.appendChild(img);
      }

      function newSnakeFood() {
        const randomX = Math.floor(Math.random() * boardSize);
        const randomY = Math.floor(Math.random() * boardSize);

        if (
          boxesMetadata[randomY][randomX].food ||
          boxesMetadata[randomY][randomX].snake
        ) {
          newSnakeFood();
          return;
        }

        const foodImg = document.createElement("div");
        foodImg.className = "snake-food";

        const tdRandom = document.getElementById(
          "pos-" + randomX + "-" + randomY
        );
        tdRandom.appendChild(foodImg);

        boxesMetadata[randomY][randomX].food = true;
      }

      function endGame(type) {
        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        document.getElementById("end").style.display = "flex";
        document.getElementById("board").style.opacity = "0.3";

        const scoreDiv = document.getElementById("end-score");
        scoreDiv.textContent = "Wynik: " + snakeBody.length;
      }

      function reset() {
        document.getElementById("end").style.display = "none";
        document.getElementById("board").style.opacity = "1";

        render();
      }
    </script>
  </body>
</html>
