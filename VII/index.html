<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/snake.css" />
  </head>
  <body onkeydown="keyDown(event)">
    <section id="settings">
      <div class="row">
        <p>Rozmiar planszy:</p>
        <input type="range" id="size-input" oninput="sizeChange()" min="10" max="100" value="20" />
        <p id="size-label"></p>
        <button onclick="render()" id="btn-render">Generuj</button>
      </div>
    </section>
    <div class="flex">
      <div id="board"></div>
    </div>
    <div id="end">
      <p><b>Koniec gry!</b></p>
      <p id="end-score"></p>
      <button onclick="reset()">Reset</button>
    </div>
    <div class="snake-head-right snake">dd</div>

    <script>
      const SNAKE_MOVE_INTERVAL = 200;
      const board = document.getElementById('board');

      let boxesMetadata = [];
      let snakeBody = [];
      let boardSize;
      let direction;
      let directionHasChanged;
      let oldDirectionChange;
      let directionChange;
      let tailDirection;
      let gameStarted;
      let snakeMoving;
      let foodSpawning;

      sizeChange();

      function sizeChange() {
        const range = document.getElementById('size-input');
        const size = range.value;

        document.getElementById('size-label').textContent = size;

        boardSize = size;
      }

      render();

      function render() {
        boxesMetadata = [];
        snakeBody = [];
        gameStarted = false;

        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        const gridTemplate = `repeat(${boardSize}, 1fr)`;
        board.style.gridTemplateRows = gridTemplate;
        board.style.gridTemplateColumns = gridTemplate;
        board.replaceChildren();

        for (let y = 0; y < boardSize; y++) {
          const boxesMetadataRow = [];

          for (let x = 0; x < boardSize; x++) {
            const box = document.createElement('div');
            box.setAttribute('id', 'pos-' + x + '-' + y);
            board.appendChild(box);
            boxesMetadataRow.push({ food: false });
          }

          boxesMetadata.push(boxesMetadataRow);
        }

        snakeBody.push({
          x: boardSize / 2,
          y: boardSize / 2,
        });
      }

      function keyDown(event) {
        if (!gameStarted) {
          gameStarted = true;
          snakeMoving = setInterval(moveSnake, SNAKE_MOVE_INTERVAL);

          newSnakeFood();
        }

        switch (event.key) {
          // direction (boolean):
          //   true - snake moves verticaly
          //   false - snake moves horizontaly

          // directionChange (number):
          //   -1 - snake moves up or left
          //   1 - snake moves down or right

          case 'ArrowRight': {
            if (!direction && directionChange == -1) {
              directionHasChanged = false;
              break;
            }

            direction = false;
            oldDirectionChange = directionChange;
            directionChange = 1;
            directionHasChanged = true;
            break;
          }
          case 'ArrowDown': {
            if (direction && directionChange == -1) {
              directionHasChanged = false;
              break;
            }

            direction = true;
            oldDirectionChange = directionChange;
            directionChange = 1;
            directionHasChanged = true;
            break;
          }
          case 'ArrowLeft': {
            if (!direction && directionChange == 1) {
              directionHasChanged = false;
              break;
            }

            direction = false;
            oldDirectionChange = directionChange;
            directionChange = -1;
            directionHasChanged = true;
            break;
          }
          case 'ArrowUp': {
            if (direction && directionChange == 1) {
              directionHasChanged = false;
              break;
            }

            direction = true;
            oldDirectionChange = directionChange;
            directionChange = -1;
            directionHasChanged = true;
            break;
          }
        }
      }

      function moveSnake() {
        const snakeHead = snakeBody[snakeBody.length - 1];

        let newHeadPos;
        let snakeTurn;

        if (direction) {
          // moving verticaly
          newHeadPos = {
            x: snakeHead.x,
            y: snakeHead.y + directionChange,
          };

          snakeTurn = directionChange < 0 ? 'up' : 'down';
        } else {
          // moving horizontaly
          newHeadPos = {
            x: snakeHead.x + directionChange,
            y: snakeHead.y,
          };

          snakeTurn = directionChange < 0 ? 'left' : 'right';
        }

        console.log(newHeadPos);

        let boxMetadata;
        try {
          boxMetadata = boxesMetadata[newHeadPos.y][newHeadPos.x];
        } catch (err) {
          endGame('1');
          return;
        }

        const newHeadDiv = document.getElementById('pos-' + newHeadPos.x + '-' + newHeadPos.y);

        if (boxMetadata?.food) {
          boxesMetadata[newHeadPos.y][newHeadPos.x].food = false;
          newSnakeFood();
        } else {
          const snakeButt = snakeBody[0];

          const tdButt = document.getElementById('pos-' + snakeButt.x + '-' + snakeButt.y);
          tdButt.className = '';

          boxesMetadata[snakeButt.y][snakeButt.x].snake = false;

          snakeBody.shift();
        }

        if (boxMetadata === undefined || boxMetadata.snake == true) {
          endGame('2');
          return;
        }

        boxesMetadata[newHeadPos.y][newHeadPos.x].snake = true;

        snakeBody.push(newHeadPos);

        // Textures - head
        newHeadDiv.className = 'tile snake-head-' + snakeTurn;

        // Textures - body
        const snakeLength = snakeBody.length;
        if (snakeLength > 1) {
          console.log(snakeBody);
          const beforeHeadPos = snakeBody[snakeLength - 2];
          console.log('pos', beforeHeadPos);
          const beforeHeadDivId = 'pos-' + beforeHeadPos.x + '-' + beforeHeadPos.y;
          const beforeHeadDiv = document.getElementById(beforeHeadDivId);
          beforeHeadDiv.className = 'tile ' + getSnakeBodyTexture();
        }

        // Textures - tail
        const tailDivPos = snakeBody[0];
        const tailDiv = document.getElementById('pos-' + tailDivPos.x + '-' + tailDivPos.y);
      }

      function newSnakeFood() {
        const randomX = Math.floor(Math.random() * boardSize);
        const randomY = Math.floor(Math.random() * boardSize);

        if (boxesMetadata[randomY][randomX].snake) {
          newSnakeFood();
          return;
        }

        const foodImg = document.createElement('div');
        foodImg.className = 'snake-food';

        const tdRandom = document.getElementById('pos-' + randomX + '-' + randomY);
        tdRandom.appendChild(foodImg);

        boxesMetadata[randomY][randomX].food = true;
      }

      function getSnakeBodyTexture() {
        if (directionHasChanged) {
          // Snake edge
          if (direction) {
            // now moves verticaly
            if (directionChange < 0) {
              // -1 - goes up
              return oldDirectionChange < 0 ? 'snake-edge-right-up' : 'snake-edge-left-up';
            } else {
              // 1 - goes down
              return oldDirectionChange < 0 ? 'snake-edge-right-down' : 'snake-edge-left-down';
            }
          } else {
            // now moves horizontaly
            if (directionChange < 0) {
              // -1 - goes left
              return oldDirectionChange < 0 ? 'snake-edge-left-down' : 'snake-edge-left-up';
            } else {
              // 1 - goes right
              return oldDirectionChange < 0 ? 'snake-edge-right-down' : 'snake-edge-right-up';
            }
          }
        } else {
          // Straight snake
          direction ? 'snake-straight-ver' : 'snake-straight-hor';
        }
      }

      function setSnakeTailTexture() {
        const tailDivPos = snakeBody[0];
        const beforeTailDivPos = snakeBody[1];

        const verDiff = tailDivPos.x - beforeTailDivPos.x;
        const horDiff = tailDivPos.y - beforeTailDivPos.y;
        if (verDif) {
          console.log(verDif);
        }
      }

      function endGame(type) {
        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        document.getElementById('end').style.display = 'flex';
        document.getElementById('board').style.opacity = '0.3';

        const scoreDiv = document.getElementById('end-score');
        scoreDiv.textContent = 'Wynik: ' + snakeBody.length;
      }

      function reset() {
        document.getElementById('end').style.display = 'none';
        document.getElementById('board').style.opacity = '1';

        render();
      }
    </script>
  </body>
</html>
