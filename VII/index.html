<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/snake.css" />
  </head>
  <body onkeydown="keyDown(event)">
    <section id="settings">
      <div class="row">
        <p>Rozmiar planszy:</p>
        <input type="range" id="size-input" oninput="sizeChange()" min="10" max="100" value="20" />
        <p id="size-label"></p>
        <button onclick="render()" id="btn-render">Generuj</button>
      </div>
    </section>
    <div class="flex">
      <div id="board"></div>
    </div>
    <div id="end">
      <p><b>Koniec gry!</b></p>
      <p id="end-score"></p>
      <button onclick="reset()">Reset</button>
    </div>

    <script>
      const SNAKE_MOVE_INTERVAL = 200;
      const board = document.getElementById('board');

      let boxesMetadata = [];
      let snakeBody = [];
      let boardSize;
      let newDirection;
      let oldDirection;
      let directionChanged;
      let gameStarted;
      let snakeMoving;
      let foodSpawning;

      sizeChange();

      function sizeChange() {
        const range = document.getElementById('size-input');
        const size = range.value;

        document.getElementById('size-label').textContent = size;

        boardSize = size;
      }

      render();

      function render() {
        boxesMetadata = [];
        snakeBody = [];
        gameStarted = false;

        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        const gridTemplate = `repeat(${boardSize}, 1fr)`;
        board.style.gridTemplateRows = gridTemplate;
        board.style.gridTemplateColumns = gridTemplate;
        board.replaceChildren();

        for (let y = 0; y < boardSize; y++) {
          const boxesMetadataRow = [];

          for (let x = 0; x < boardSize; x++) {
            const box = document.createElement('div');
            box.setAttribute('id', 'pos-' + x + '-' + y);
            board.appendChild(box);
            boxesMetadataRow.push({ food: false });
          }

          boxesMetadata.push(boxesMetadataRow);
        }

        snakeBody.push({
          x: boardSize / 2,
          y: boardSize / 2,
        });
      }

      function startGame() {
        if (!gameStarted) {
          gameStarted = true;
          snakeMoving = setInterval(moveSnake, SNAKE_MOVE_INTERVAL);

          newSnakeFood();
        }
      }

      function keyDown(event) {
        switch (event.key) {
          // 0 - up
          // 1 - right
          // 2 - down
          // 3 - left

          case 'ArrowRight': {
            if (oldDirection === 3) {
              break;
            }

            startGame();

            newDirection = 1;
            directionChanged = true;
            break;
          }

          case 'ArrowDown': {
            if (oldDirection === 0) {
              break;
            }

            startGame();

            newDirection = 2;
            directionChanged = true;
            break;
          }

          case 'ArrowLeft': {
            if (oldDirection === 1) {
              break;
            }

            startGame();

            newDirection = 3;
            directionChanged = true;
            break;
          }

          case 'ArrowUp': {
            if (oldDirection === 2) {
              break;
            }

            startGame();

            newDirection = 0;
            directionChanged = true;
            break;
          }
        }
      }

      function moveSnake() {
        const snakeHead = snakeBody[snakeBody.length - 1];

        let newHeadPos;
        let snakeHeadTurn;

        switch (newDirection) {
          // Up
          case 0: {
            newHeadPos = {
              x: snakeHead.x,
              y: snakeHead.y - 1,
            };

            snakeBody[snakeBody.length - 1].direction = 'up';

            snakeHeadTurn = 'up';
            console.log('up');
            break;
          }
          // Right
          case 1: {
            newHeadPos = {
              x: snakeHead.x + 1,
              y: snakeHead.y,
            };

            snakeBody[snakeBody.length - 1].direction = 'right';

            snakeHeadTurn = 'right';
            console.log('right');
            break;
          }
          // Down
          case 2: {
            newHeadPos = {
              x: snakeHead.x,
              y: snakeHead.y + 1,
            };

            snakeBody[snakeBody.length - 1].direction = 'down';

            snakeHeadTurn = 'down';
            console.log('down');
            break;
          }
          // Left
          case 3: {
            newHeadPos = {
              x: snakeHead.x - 1,
              y: snakeHead.y,
            };

            snakeBody[snakeBody.length - 1].direction = 'left';

            snakeHeadTurn = 'left';
            console.log('left');
            break;
          }
        }

        let boxMetadata;
        try {
          boxMetadata = boxesMetadata[newHeadPos.y][newHeadPos.x];
        } catch (err) {
          console.log(err);
          endGame('1');
          return;
        }

        const newHeadDiv = document.getElementById('pos-' + newHeadPos.x + '-' + newHeadPos.y);

        if (boxMetadata?.food) {
          boxesMetadata[newHeadPos.y][newHeadPos.x].food = false;

          document.getElementsByClassName('snake-food')[0].className = '';

          newSnakeFood();
        } else {
          const snakeButt = snakeBody[0];

          const tdButt = document.getElementById('pos-' + snakeButt.x + '-' + snakeButt.y);
          tdButt.className = '';

          boxesMetadata[snakeButt.y][snakeButt.x].snake = false;

          snakeBody.shift();
        }

        console.table(boxMetadata);

        if (boxMetadata === undefined || boxMetadata.snake == true) {
          endGame('2');
          return;
        }

        boxesMetadata[newHeadPos.y][newHeadPos.x].snake = true;

        snakeBody.push(newHeadPos);

        // Textures - head
        newHeadDiv.className = 'tile snake-head-' + snakeHeadTurn;

        // Textures - body
        const snakeLength = snakeBody.length;
        if (snakeLength > 1) {
          const beforeHeadPos = snakeBody[snakeLength - 2];
          const beforeHeadDivId = 'pos-' + beforeHeadPos.x + '-' + beforeHeadPos.y;
          const beforeHeadDiv = document.getElementById(beforeHeadDivId);

          if (snakeLength > 2) {
            if (directionChanged) {
              if ((oldDirection == 0 && newDirection == 1) || (oldDirection == 3 && newDirection == 2)) {
                beforeHeadDiv.className = 'tile snake-edge-right-down';
              } else if ((oldDirection == 1 && newDirection == 2) || (oldDirection == 0 && newDirection == 3)) {
                beforeHeadDiv.className = 'tile snake-edge-left-down';
              } else if ((oldDirection == 2 && newDirection == 3) || (oldDirection == 1 && newDirection == 0)) {
                beforeHeadDiv.className = 'tile snake-edge-left-up';
              } else {
                beforeHeadDiv.className = 'tile snake-edge-right-up';
              }
            } else {
              if (newDirection == 0 || newDirection == 2) {
                console.log('straight');
                beforeHeadDiv.className = 'tile snake-straight-ver';
              } else {
                beforeHeadDiv.className = 'tile snake-straight-hor';
              }
            }
          }

          const snakeEndPos = snakeBody[0];
          const snakeEndDivId = 'pos-' + snakeEndPos.x + '-' + snakeEndPos.y;
          const snakeEndDiv = document.getElementById(snakeEndDivId);

          snakeEndDiv.className = 'tile snake-tail-' + snakeEndPos.direction;
        }

        oldDirection = newDirection;
        directionChanged = false;
      }

      function newSnakeFood() {
        const randomX = Math.floor(Math.random() * boardSize);
        const randomY = Math.floor(Math.random() * boardSize);

        if (boxesMetadata[randomY][randomX].snake) {
          newSnakeFood();
          return;
        }

        const tdRandom = document.getElementById('pos-' + randomX + '-' + randomY);
        tdRandom.className = 'tile snake-food';

        boxesMetadata[randomY][randomX].food = true;
      }

      function endGame(type) {
        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        document.getElementById('end').style.display = 'flex';
        document.getElementById('board').style.opacity = '0.3';

        const scoreDiv = document.getElementById('end-score');
        scoreDiv.textContent = 'Wynik: ' + snakeBody.length;
      }

      function reset() {
        document.getElementById('end').style.display = 'none';
        document.getElementById('board').style.opacity = '1';

        render();
      }
    </script>
  </body>
</html>
