<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      td {
        width: 20px;
        height: 20px;
        border: 1px dotted lightblue;
      }

      table {
        border: 5px dashed lightblue;
      }

      .snake-body {
        background: orange;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body onkeydown="keyDown(event)">
    <table id="board"></table>
  </body>
  <script>
    const BOARD_SIZE = 20;
    const board = document.getElementById("board");

    for (let i = 0; i < BOARD_SIZE; i++) {
      const tr = document.createElement("tr");
      for (let j = 0; j < BOARD_SIZE; j++) {
        const td = document.createElement("td");
        td.setAttribute("id", "pos-" + i + "-" + j);
        tr.appendChild(td);
      }
      board.appendChild(tr);
    }

    const snakeBody = [
      {
        x: BOARD_SIZE / 2,
        y: BOARD_SIZE / 2,
      },
    ];

    let direction = 2;

    function keyDown(event) {
      const newDirection = event.keyCode - 37;
      if ((direction - newDirection) % 2 == 0) return;
      direction = newDirection;
    }

    function moveSnake() {
      const snakeButt = snakeBody[0];
      const snakeHead = snakeBody[snakeBody.length - 1];

      const newHead = {
        x: direction % 2 == 0 ? snakeHead.x + (direction - 1) : snakeHead.x,
        y: direction % 2 == 1 ? snakeHead.y - (direction - 2) : snakeHead.y,
      };

      snakeBody.shift();
      snakeBody.push(newHead);

      console.log(newHead);
      console.table(snakeBody);

      const tdHead = document.getElementById(
        "pos-" + newHead.x + "-" + newHead.y
      );

      const img = document.createElement("div");
      img.className = "snake-body";
      tdHead.appendChild(img);

      const tdButt = document.getElementById(
        "pos-" + snakeButt.x + "-" + snakeButt.y
      );
      tdButt.replaceChildren();
    }

    setInterval(moveSnake, 500);
  </script>
</html>
