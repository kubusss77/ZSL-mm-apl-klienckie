<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/snake.css" />
  </head>
  <body onkeydown="keyDown(event)">
    <section id="settings">
      <div class="row">
        <p>Rozmiar planszy:</p>
        <input
          type="range"
          id="size-input"
          oninput="sizeChange()"
          min="10"
          max="100"
          value="20"
        />
        <p id="size-label"></p>
        <button onclick="render()" id="btn-render">Generuj</button>
      </div>
    </section>
    <div class="flex">
      <div id="board"></div>
    </div>
    <div id="end">
      <p><b>Koniec gry!</b></p>
      <p id="end-score"></p>
      <button onclick="reset()">Reset</button>
    </div>
    <div class="snake-head-right snake">dd</div>

    <script>
      const SNAKE_MOVE_INTERVAL = 200;
      const board = document.getElementById("board");

      let boxesMetadata = [];
      let snakeBody = [];
      let boardSize;
      let direction;
      let directionHasChanged;
      let directionChange;
      let gameStarted;
      let snakeMoving;
      let foodSpawning;

      sizeChange();

      function sizeChange() {
        const range = document.getElementById("size-input");
        const size = range.value;

        document.getElementById("size-label").textContent = size;

        boardSize = size;
      }

      render();

      function render() {
        boxesMetadata = [];
        snakeBody = [];
        gameStarted = false;

        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        const gridTemplate = `repeat(${boardSize}, 1fr)`;
        board.style.gridTemplateRows = gridTemplate;
        board.style.gridTemplateColumns = gridTemplate;
        board.replaceChildren();

        for (let y = 0; y < boardSize; y++) {
          const boxesMetadataRow = [];

          for (let x = 0; x < boardSize; x++) {
            const box = document.createElement("div");
            box.className = "box";
            box.setAttribute("id", "pos-" + x + "-" + y);
            board.appendChild(box);
            boxesMetadataRow.push({ food: false });
          }

          boxesMetadata.push(boxesMetadataRow);
        }

        snakeBody.push({
          x: boardSize / 2,
          y: boardSize / 2,
        });
      }

      function keyDown(event) {
        if (!gameStarted) {
          gameStarted = true;
          snakeMoving = setInterval(moveSnake, SNAKE_MOVE_INTERVAL);

          newSnakeFood();
        }

        switch (event.key) {
          // direction (boolean):
          //   true - snake moves verticaly
          //   false - snake moves horizontaly

          // directionChange (number):
          //   -1 - snake moves up or left
          //   1 - snake moves down or right

          case "ArrowRight": {
            if (!direction && directionChange == -1) {
              directionHasChanged = false;
              break;
            }

            direction = false;
            directionChange = 1;
            directionHasChanged = true;
            break;
          }
          case "ArrowDown": {
            if (direction && directionChange == -1) {
              directionHasChanged = false;
              break;
            }

            direction = true;
            directionChange = 1;
            directionHasChanged = true;
            break;
          }
          case "ArrowLeft": {
            if (!direction && directionChange == 1) {
              directionHasChanged = false;
              break;
            }

            direction = false;
            directionChange = -1;
            directionHasChanged = true;
            break;
          }
          case "ArrowUp": {
            if (direction && directionChange == 1) {
              directionHasChanged = false;
              break;
            }

            direction = true;
            directionChange = -1;
            directionHasChanged = true;
            break;
          }
        }
      }

      function moveSnake() {
        const snakeHead = snakeBody[snakeBody.length - 1];

        let newHead;
        let snakeTurn;

        if (direction) {
          // moving verticaly
          newHead = {
            x: snakeHead.x,
            y: snakeHead.y + directionChange,
          };

          snakeTurn = directionChange < 0 ? "up" : "down";
        } else {
          // moving horizontaly
          newHead = {
            x: snakeHead.x + directionChange,
            y: snakeHead.y,
          };

          snakeTurn = directionChange < 0 ? "left" : "right";
        }

        console.log(newHead);

        let boxMetadata;
        try {
          boxMetadata = boxesMetadata[newHead.y][newHead.x];
        } catch (err) {
          endGame("1");
          return;
        }

        const tdHead = document.getElementById(
          "pos-" + newHead.x + "-" + newHead.y
        );

        if (boxMetadata?.food) {
          boxesMetadata[newHead.y][newHead.x].food = false;
          tdHead.replaceChildren();
          newSnakeFood();
        } else {
          const snakeButt = snakeBody[0];

          const tdButt = document.getElementById(
            "pos-" + snakeButt.x + "-" + snakeButt.y
          );
          tdButt.replaceChildren();

          boxesMetadata[snakeButt.y][snakeButt.x].snake = false;

          snakeBody.shift();
        }

        if (boxMetadata === undefined || boxMetadata.snake == true) {
          endGame("2");
          return;
        }

        boxesMetadata[newHead.y][newHead.x].snake = true;

        snakeBody.push(newHead);

        const headTextureDiv = document.createElement("div");
        headTextureDiv.className = "tile snake-head-" + snakeTurn;
        tdHead.appendChild(headTextureDiv);
      }

      function newSnakeFood() {
        const randomX = Math.floor(Math.random() * boardSize);
        const randomY = Math.floor(Math.random() * boardSize);

        if (boxesMetadata[randomY][randomX].snake) {
          newSnakeFood();
          return;
        }

        const foodImg = document.createElement("div");
        foodImg.className = "snake-food";

        const tdRandom = document.getElementById(
          "pos-" + randomX + "-" + randomY
        );
        tdRandom.appendChild(foodImg);

        boxesMetadata[randomY][randomX].food = true;
      }

      function endGame(type) {
        clearInterval(snakeMoving);
        clearInterval(foodSpawning);

        document.getElementById("end").style.display = "flex";
        document.getElementById("board").style.opacity = "0.3";

        const scoreDiv = document.getElementById("end-score");
        scoreDiv.textContent = "Wynik: " + snakeBody.length;
      }

      function reset() {
        document.getElementById("end").style.display = "none";
        document.getElementById("board").style.opacity = "1";

        render();
      }
    </script>
  </body>
</html>
