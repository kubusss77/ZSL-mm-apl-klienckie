<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input id="input" type="text" style="width: 200px">
  <script>
    const element = document.getElementById("input");

    let value = "Ciekawe czy uda Ci się to zrobić                     "

    setInterval(() => {
      element.value = value;
      value = value.slice(1) + value.charAt(0);
    }, 100)
  </script>
</body>
</html>
