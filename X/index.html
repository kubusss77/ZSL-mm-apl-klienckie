<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dratewka the Shoemaker - Jakub Szczepa 4Ib</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-window">
      <div id="game-window-controls">
        <h1>Dratewka the Shoemaker</h1>
        <audio id="audio-intro" src="./assets/intro.mp3"></audio>
      </div>
      <div id="game-window-content">
        <div>
          <img src="./assets/czolowka/czolowka.jpg" class="intro-img" id="czolowka" />
          <img src="./assets/czolowka/opis_A.jpg" class="intro-img" id="opis_A" style="display: none" />
          <img src="./assets/czolowka/opis_B.jpg" class="intro-img" id="opis_B" style="display: none" />
          <p id="intro-text">Click any key to start</p>
        </div>
        <p id="location-desc"></p>
        <div id="gfx">
          <img id="gfx-img" />
          <div id="div-compass">
            <img id="gfx-compass" src="./assets/kompas.png" />
            <p id="compass-n" class="compass-directions" style="top: 30px; left: 135px">N</p>
            <p id="compass-e" class="compass-directions" style="top: 88px; left: 270px">E</p>
            <p id="compass-s" class="compass-directions" style="top: 150px; left: 140px">S</p>
            <p id="compass-w" class="compass-directions" style="top: 88px; left: 16px">W</p>
          </div>
        </div>
        <p id="available-paths"></p>
        <p id="visible-items"></p>
        <p id="carried-item"></p>
        <div id="what-now">
          <p id="what-now-text">What now?</p>
          <input id="user-input" type="text" autofocus autocomplete="off" />
        </div>
      </div>
    </div>
  </body>
  <script type="module">
    import { Game } from './scripts/game.js';
    const game = new Game();

    // Skipuje czolowke, opis_A i opis_b
    const skipIntro = false;

    if (skipIntro) {
      document.getElementById('czolowka').style.display = 'none';
      game.start();
    } else {
      await game.intro();
    }
  </script>
</html>
