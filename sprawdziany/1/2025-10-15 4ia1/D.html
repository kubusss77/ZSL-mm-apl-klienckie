  <body>
    <script>
      function compare(num1, num2, num3) {
        let smallest;
        let biggest;

        if (num1 < num2) {
          if (num1 < num3) {
            smallest = num1;
          } else {
            biggest = num2;
          }
        } else {
          if (num1 < num3) {
            biggest = num3;
          } else {
            biggest = num1;
          }
        }

        if (num2 < num3) {
          if (num2 < num1) {
            smallest = num2;
          } else {
            biggest = num3;
          }
        } else {
          if (num3 < num1) {
            smallest = num3;
          } else {
            biggest = num2;
          }
        }

        console.log(`Największy: ${biggest}, najmniejszy: ${smallest}`);
        if (num1 != num2 && num2 != num3 && num1 != num3) {
          return (num1 + num2 + num3) / 3;
        } else {
          return 'Są liczby równe';
        }
      }

      console.log(compare(3, 1, 3));
    </script>
