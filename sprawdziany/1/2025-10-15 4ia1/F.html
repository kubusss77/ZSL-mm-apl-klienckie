<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function spiralEncrypt(text) {
        console.log('Text', text);
        console.log('Length', text.length);

        const wall = Math.ceil(Math.sqrt(text.length));
        console.log('Wall', wall);

        let spiral = [];
        for (let i = 0; i < wall; i++) {
          let col = [];
          for (let j = 0; j < wall; j++) {
            col.push(undefined);
          }
          spiral.push(col);
        }

        let charNumber = 0;

        for (let x = 0; x < wall; x++) {
          for (let i = x; i < wall - (1 + x); i++) {
            spiral[x][i] = text.charAt(charNumber) || '_';
            charNumber++;
          }

          for (let i = x; i < wall - (1 + x); i++) {
            spiral[i][wall - (1 + x)] = text.charAt(charNumber) || '_';
            charNumber++;
          }

          for (let i = wall - (1 + x); i > x; i--) {
            spiral[wall - (1 + x)][i] = text.charAt(charNumber) || '_';
            charNumber++;
          }

          for (let i = wall - (1 + x); i > x; i--) {
            spiral[i][x] = text.charAt(charNumber) || '_';
            charNumber++;
          }

          if (wall * wall - 1 == charNumber) {
            if (wall % 2 == 1) {
              spiral[Math.floor(wall / 2)][Math.floor(wall / 2)] = text.charAt(charNumber) || '_';
            }
          }
        }
        console.table(spiral);

        let encrypted = '';
        for (let i = 0; i < wall; i++) {
          for (let j = 0; j < wall; j++) {
            encrypted += spiral[i][j];
          }
        }

        console.log('Encrypted', encrypted);
      }

      spiralEncrypt('Lorem ipsum dolor sit amet consensus. Lorem ipsum dolor sit amet consensus');
    </script>
  </body>
</html>
