<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function capitalizeWords(string = '') {
        const words = string.split(' ');
        let ret = '';
        words.forEach((word) => {
          ret += word.charAt(0).toUpperCase() + word.substr(1, word.length) + ' ';
        });

        return ret;
      }

      console.log(capitalizeWords('ala ma kota'));
    </script>
  </head>
  <body></body>
</html>
